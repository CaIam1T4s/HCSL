name: Windows runtime checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-runtime:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore server tests
        run: dotnet restore tests/HCSL.ServerTests/HCSL.ServerTests.csproj
      - name: Build daemon and server tests
        run: dotnet build tests/HCSL.ServerTests/HCSL.ServerTests.csproj --no-restore -v:q
      - name: Run independent Windows sections and summarize
        run: dotnet run --file build/TestSummary.cs -- windows
      - name: Upload Windows test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-logs
          path: ${{ runner.temp }}/**/hcsl-test-results-*/*.log
          if-no-files-found: ignore
